  <style>
    :root {
      --color-bg: #ffffff;
      --color-surface: #f5f5f7;
      --color-text: #1d1d1f;
      --color-text-secondary: #86868b;
      --color-accent: #0071e3;
      --color-accent-hover: #0077ed;
      --color-border: #d2d2d7;
      --color-card-bg: #ffffff;
      --shadow-card: 0 2px 12px rgba(0, 0, 0, 0.06);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --color-bg: #000000;
        --color-surface: #1c1c1e;
        --color-text: #f5f5f7;
        --color-text-secondary: #86868b;
        --color-accent: #2997ff;
        --color-accent-hover: #40a9ff;
        --color-border: #38383a;
        --color-card-bg: #1c1c1e;
        --shadow-card: 0 2px 12px rgba(0, 0, 0, 0.3);
      }
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
      background: var(--color-bg);
      color: var(--color-text);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .container {
      max-width: 980px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* Hero */
    .hero {
      text-align: center;
      padding: 64px 24px 80px;
    }

    .hero-banner {
      position: relative;
      max-width: 980px;
      margin: 0 auto 40px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 12px 48px rgba(0, 0, 0, 0.25);
    }

    .hero-banner > img {
      display: block;
      width: 100%;
      height: auto;
    }

    .hero-overlay {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      width: 56%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(10px, 1.6vw, 20px);
      padding: 4% 5%;
      text-align: center;
      background: linear-gradient(90deg, rgba(2, 6, 28, 0) 0%, rgba(2, 6, 28, 0.35) 60%);
    }

    .hero-overlay-lockup {
      display: flex;
      align-items: center;
      gap: clamp(10px, 1.6vw, 20px);
    }

    .hero-overlay-icon {
      width: clamp(48px, 8vw, 96px);
      height: clamp(48px, 8vw, 96px);
      border-radius: clamp(10px, 1.6vw, 22px);
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.4);
    }

    .hero-overlay-name {
      font-size: clamp(2.2rem, 6vw, 4.5rem);
      font-weight: 700;
      letter-spacing: -0.025em;
      line-height: 1;
      color: #ffffff;
      text-shadow: 0 2px 16px rgba(0, 0, 0, 0.5);
    }

    .hero-overlay-tagline {
      font-size: clamp(0.85rem, 1.5vw, 1.25rem);
      font-weight: 400;
      line-height: 1.5;
      max-width: 22em;
      color: rgba(255, 255, 255, 0.92);
      text-shadow: 0 1px 10px rgba(0, 0, 0, 0.5);
    }

    .app-store-badge {
      display: inline-block;
      transition: opacity 0.2s;
    }

    .app-store-badge:hover {
      opacity: 0.8;
    }

    .app-store-badge img {
      height: 40px;
      vertical-align: middle;
    }

    .download-buttons {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .dmg-badge {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      height: 40px;
      padding: 0 13px 0 8px;
      background: #000;
      color: #fff;
      text-decoration: none;
      border-radius: 7px;
      border: 0.5px solid #a6a6a6;
      transition: opacity 0.2s;
    }

    @media (prefers-color-scheme: dark) {
      .dmg-badge {
        background: #fff;
        color: #000;
        border-color: #fff;
      }
    }

    .dmg-badge:hover {
      opacity: 0.8;
    }

    .dmg-badge svg {
      width: 24px;
      height: 24px;
      flex-shrink: 0;
      fill: currentColor;
    }

    .dmg-badge-text {
      display: flex;
      flex-direction: column;
      line-height: 1.1;
    }

    .dmg-badge-label {
      font-size: 8.5px;
      font-weight: 500;
    }

    .dmg-badge-title {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

      align-items: stretch;
      width: 100%;
      max-width: 280px;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 8px;
      overflow: hidden;
    }

    .brew-cmd code {
      flex: 1;
      min-width: 0;
      padding: 8px 10px;
      font-family: "SF Mono", SFMono-Regular, Menlo, monospace;
      font-size: 11.5px;

      white-space: nowrap;
      overflow-x: auto;
      text-align: left;
      user-select: all;
      cursor: text;

      height: 100%;
      padding: 8px 0;
      background: none;
      border: none;

      cursor: pointer;
      color: var(--color-text-secondary);

      height: 14px;
      fill: currentColor;
    }

      font-size: 40px;
      font-weight: 700;
      letter-spacing: -0.02em;

      font-size: 18px;

    .get-grid {

      margin: 0 auto;

    .get-card {

      flex-direction: column;
      align-items: center;

      font-size: 20px;
      font-weight: 600;
      margin-bottom: 8px;

    .get-card p {
      font-size: 15px;
      color: var(--color-text-secondary);
      line-height: 1.6;
    }

    .get-card-cta {
      padding-top: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      width: 100%;

      margin: 32px auto 0;
      text-align: center;
      font-size: 13px;
      color: var(--color-text-secondary);
      line-height: 1.5;

    /* Footer */
    footer {
      border-top: 1px solid var(--color-border);
      padding: 32px 0;
      margin-top: 40px;
    }

    .footer-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }

    .footer-links {
      display: flex;
      gap: 24px;
      align-items: center;
      flex-wrap: wrap;
    }

    .footer-links a,
    .lang-toggle {
      color: var(--color-text-secondary);
      text-decoration: none;
      font-size: 14px;
      transition: color 0.2s;
    }

    .footer-links a:hover,

      color: var(--color-accent);
    }

    .lang-toggle {
      background: none;
      border: none;
      cursor: pointer;
      font-family: inherit;
    }

    .copyright {
      font-size: 14px;
      color: var(--color-text-secondary);

    /* Responsive */
    @media (max-width: 768px) {

    @media (max-width: 480px) {
      .hero-overlay {
        width: 100%;
        justify-content: flex-end;

      }

      }

      .footer-inner {

        text-align: center;
      }

  </style>
</head>

  <script>
    (function () {
      var lang = 'ja';
      var elements = document.querySelectorAll('[data-ja]');

      function applyLang(l) {
        lang = l;
        elements.forEach(function (el) {
          el.textContent = el.getAttribute('data-' + lang);
        });
        document.querySelectorAll('[data-alt-' + lang + ']').forEach(function (el) {
          el.alt = el.getAttribute('data-alt-' + lang);
        });
        document.querySelectorAll('[data-src-' + lang + ']').forEach(function (el) {
          el.src = el.getAttribute('data-src-' + lang);
        });
        document.documentElement.lang = lang;
        // Update App Store badge language (all instances)
        var locale = lang === 'ja' ? 'ja-jp' : 'en-us';
        document.querySelectorAll('.app-store-badge').forEach(function (badge) {
          var img = badge.querySelector('img');
          var source = badge.querySelector('source');
          if (img && source) {
            img.src = 'https://tools.applemediaservices.com/api/badges/download-on-the-mac-app-store/black/' + locale;
            source.srcset = 'https://tools.applemediaservices.com/api/badges/download-on-the-mac-app-store/white/' + locale;
          }
        });
      }

      window.toggleLang = function () {
        applyLang(lang === 'ja' ? 'en' : 'ja');
      };

      var initialLang = (navigator.language || '').startsWith('ja') ? 'ja' : 'en';
      applyLang(initialLang);
    })();
